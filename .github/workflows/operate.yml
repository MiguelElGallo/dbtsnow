name: Operator - run native dbt

on:
  workflow_dispatch:
    inputs:
      command:
        description: Native dbt operation (build and retry can write model relations)
        type: choice
        required: true
        default: build
        options: [build, compile, retry, source-freshness]
      state_from:
        description: Optional baseline DB.SCHEMA.PROJECT for a state-based build or compile
        type: string
        default: ''
      select:
        description: Optional single dbt selector
        type: string
        default: ''
      defer:
        description: Resolve unbuilt refs using baseline state (requires state_from)
        type: boolean
        default: false
      writeback:
        description: Persist LIVE artifacts for retry (serialized with deployment)
        type: boolean
        default: false

permissions:
  contents: read

# Both workflows share this lock: deployment replaces LIVE retry artifacts.
concurrency:
  group: native-dbt-dev
  cancel-in-progress: false

jobs:
  operate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev-operate
    permissions:
      contents: read
      id-token: write
    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_OPERATOR_USER }}
      DBT_COMMAND: ${{ inputs.command }}
      STATE_FROM: ${{ inputs.state_from }}
      DBT_SELECTION: ${{ inputs.select }}
      DEFER_MODELS: ${{ inputs.defer }}
      WRITEBACK: ${{ inputs.writeback }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.17'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Run local gates before authenticating
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check
          uv run python -m unittest discover -s tests -v
      - name: Preview the operator command
        shell: bash
        run: |
          set -euo pipefail
          args=(run --config deployment/dev.json --command "$DBT_COMMAND")
          if [[ -n "$STATE_FROM" ]]; then args+=(--state-from "$STATE_FROM"); fi
          if [[ -n "$DBT_SELECTION" ]]; then args+=(--select "$DBT_SELECTION"); fi
          if [[ "$DEFER_MODELS" == "true" ]]; then args+=(--defer); fi
          if [[ "$WRITEBACK" == "true" ]]; then args+=(--writeback); else args+=(--no-writeback); fi
          uv run python scripts/dbt_native.py "${args[@]}"
      - uses: snowflakedb/snowflake-actions@1160898243c351349621a6c2bac2e455ab1077b2 # v3
        with:
          cli-version: '3.28.0'
          use-oidc: true
          default-config-file-path: .github/no-local-connection.toml
      - name: Execute as the operator without deploying source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SNOWFLAKE_ACCOUNT"
          test -n "$SNOWFLAKE_USER"
          args=(run --config deployment/dev.json --command "$DBT_COMMAND" --temporary-connection --apply)
          if [[ -n "$STATE_FROM" ]]; then args+=(--state-from "$STATE_FROM"); fi
          if [[ -n "$DBT_SELECTION" ]]; then args+=(--select "$DBT_SELECTION"); fi
          if [[ "$DEFER_MODELS" == "true" ]]; then args+=(--defer); fi
          if [[ "$WRITEBACK" == "true" ]]; then args+=(--writeback); else args+=(--no-writeback); fi
          uv run python scripts/dbt_native.py "${args[@]}"
